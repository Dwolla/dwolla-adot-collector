extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  sigv4auth:
    service: monitoring
    region: ${env:AWS_REGION}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:55681
  zipkin:
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otelcol-custom
          scrape_interval: 60s
          static_configs:
            - targets:
                - 127.0.0.1:18888

processors:
  memory_limiter:
      # Percentages of the container's memory limit (cgroup), so the limiter stays below whatever limit the container
      # is deployed with; a fixed limit_mib above the container limit means the kernel kills the collector before the
      # limiter can push back.
      limit_percentage: 75
      spike_limit_percentage: 20
      check_interval: 5s
  batch/traces:
    timeout: 5s
    send_batch_size: 50 # spans (i.e. segments; X-Ray limits us to 50 segments per PutTraceSegments request)
    send_batch_max_size: 50 # spans (i.e. segments; X-Ray limits us to 50 segments per PutTraceSegments request)
  attributes:
    actions:
      - key: deployment.environment.name
        value: ${env:DWOLLA_ENV}
        action: insert

      # rename attributes to follow OTel semantic conventions
      - key: url.full
        action: insert
        # from https://github.com/typelevel/natchez-http4s/blob/168f5031323a573b5641f43c74a25d1a996f7b61/modules/http4s/src/main/scala/natchez/http4s/NatchezMiddleware.scala#L176
        from_attribute: client.http.uri
      - key: http.request.method
        action: insert
        # from https://github.com/typelevel/natchez-http4s/blob/168f5031323a573b5641f43c74a25d1a996f7b61/modules/http4s/src/main/scala/natchez/http4s/NatchezMiddleware.scala#L177
        from_attribute: client.http.method
      - key: http.response.status_code
        action: insert
        # from https://github.com/typelevel/natchez-http4s/blob/168f5031323a573b5641f43c74a25d1a996f7b61/modules/http4s/src/main/scala/natchez/http4s/NatchezMiddleware.scala#L183
        from_attribute: client.http.status_code
      - key: http.response.status_code
        action: insert
        # from https://github.com/typelevel/natchez-http4s/blob/168f5031323a573b5641f43c74a25d1a996f7b61/modules/http4s/src/main/scala/natchez/http4s/NatchezMiddleware.scala#L58
        from_attribute: http.status_code
      # remove the attributes we copied to complete the renaming
      - action: delete
        pattern: client\.http\.uri|client\.http\.method|(?:client\.)?http\.status_code
  transform/status-code-is-int:
    # Natchez-http4s sets http.response.status_code as a string, but the OTel semantic
    # conventions define it as an int, and X-Ray won't display it otherwise.
    # see https://github.com/typelevel/natchez-http4s/blob/168f5031323a573b5641f43c74a25d1a996f7b61/modules/http4s/src/main/scala/natchez/http4s/NatchezMiddleware.scala#L183
    trace_statements:
      - context: span
        statements:
          - set(attributes["http.response.status_code"], Int(attributes["http.response.status_code"]))
  transform/replace-exclamation-with-colon:
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["peer.service"], "!", ":")
  linkextractor:
    attribute_name: "linked_trace_ids"
  transform/flatten-linked-trace-ids:
    trace_statements:
      - context: span
        statements:
          - set(attributes["linked_trace_ids"], String(attributes["linked_trace_ids"]))
  resource/metrics:
    attributes:
      - key: deployment.environment.name
        value: ${env:DWOLLA_ENV}
        action: insert
  metricstarttime:
    # The Prometheus receiver in this version no longer sets start times on cumulative points, and CloudWatch rejects
    # points without them. With no start-time metric in the scrape, this falls back to the collector's own start time,
    # which is exact here because the scraped process is the collector. It runs after transform/self-metrics because that
    # turns one gauge into a cumulative sum, and start times must be set on the final sums. It must run before batching.
    strategy: start_time_metric
  # The next three processors only see the scraped self-metrics (see the metrics/self pipeline). They undo what the
  # round trip through the Prometheus format and scrape loses or adds, so the metrics keep the names, types, units, and
  # attributes they had when the collector pushed them over OTLP.
  filter/self-metrics:
    # drops the series the receiver adds (up, scrape_*) and the endpoint's own handler stats; they aren't collector metrics
    # Also drops this filter's own counter: the push path never had it, so it stays out of the self-metric contract.
    metrics:
      metric:
        - not IsMatch(name, "^otelcol_")
        - IsMatch(name, "^otelcol_processor_filter_")
  resource/self-metrics:
    attributes:
      - key: server.address
        action: delete
      - key: server.port
        action: delete
      - key: url.scheme
        action: delete
      - key: service.version
        value: ""
        action: insert
  transform/self-metrics:
    # The Prometheus format carries no units (without_units keeps the names unchanged), so each otelcol_ metric's unit
    # is set by name here. A collector upgrade that adds otelcol_ metrics means extending this table;
    # test_self_metrics_all_have_units fails until it is.
    # The convert_gauge_to_sum statement is a deliberate one-off: the Prometheus format can't carry a non-monotonic
    # sum, so that one metric (an up-down counter) arrives as a gauge and is turned back into a sum.
    metric_statements:
      - context: metric
        statements:
          - set(unit, "{batches}") where IsMatch(name, "^otelcol_exporter_queue_(capacity|size)$")
          - set(unit, "{datapoints}") where IsMatch(name, "^otelcol_(exporter_send_failed|exporter_sent|processor_accepted|receiver_accepted|receiver_failed|receiver_refused)_metric_points$")
          - set(unit, "{spans}") where IsMatch(name, "^otelcol_(exporter_send_failed|exporter_sent|processor_accepted|receiver_accepted|receiver_failed|receiver_refused)_spans$")
          - set(unit, "s") where IsMatch(name, "^otelcol_process_(cpu_seconds|uptime)$")
          - set(unit, "By") where IsMatch(name, "^otelcol_process_(memory_rss|runtime_heap_alloc_bytes|runtime_total_alloc_bytes|runtime_total_sys_memory_bytes)$")
          - set(unit, "{units}") where IsMatch(name, "^otelcol_(exporter_queue|processor_batch)_batch_send_size$")
          - set(unit, "{combinations}") where name == "otelcol_processor_batch_metadata_cardinality"
          - set(unit, "{times}") where IsMatch(name, "^otelcol_processor_batch_(batch_size|timeout)_trigger_send$")
          - set(unit, "{items}") where IsMatch(name, "^otelcol_processor_(incoming|outgoing)_items$")
          - convert_gauge_to_sum("cumulative", false) where name == "otelcol_processor_batch_metadata_cardinality"
  batch/metrics:
    timeout: 10s
    send_batch_size: 200
    send_batch_max_size: 1000 # the CloudWatch OTLP endpoint accepts at most 1,000 data points per request

exporters:
  awsxray:
    max_retries: 8           # Increase from default 2
    num_workers: 1           # limits burstiness in multi-collector fleet
    indexed_attributes: # see https://github.com/Dwolla/dwolla-otel-natchez/blob/dc1aa448d97a91f50ec52653b3e28d7fbf147f87/dwolla-xray-annotations/src/test/scala/com/dwolla/tracing/XRayAnnotationsSpec.scala#L27-L33
      - linked_trace_ids
      - deployment.environment.name
      - otel.resource.deployment.environment.name
      - otel.resource.service.name
      - com.dwolla.client.account.id
      - com.dwolla.enduser.account.id
      - com.dwolla.transaction.id
      - com.dwolla.event-bus.message-handling-result
  otlphttp/cloudwatch:
    metrics_endpoint: https://monitoring.${env:AWS_REGION}.amazonaws.com/v1/metrics
    auth:
      authenticator: sigv4auth

service:
  pipelines:
    traces:
      receivers:
        - otlp
        - zipkin
      processors:
        - memory_limiter
        - attributes
        - transform/replace-exclamation-with-colon
        - transform/status-code-is-int
        - linkextractor
        - transform/flatten-linked-trace-ids
        # when we start using groupbytrace/tail_sampling, they must happen before batching
        - batch/traces
      exporters:
        - awsxray
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/metrics
        - batch/metrics
      exporters:
        - otlphttp/cloudwatch
    metrics/self:
      receivers:
        - prometheus/self
      processors:
        - memory_limiter
        - filter/self-metrics
        - resource/self-metrics
        - transform/self-metrics
        - metricstarttime
        - resource/metrics
        - batch/metrics
      exporters:
        - otlphttp/cloudwatch

  extensions:
    - health_check
    - sigv4auth

  # Publish the collector's own metrics (e.g. otelcol_exporter_sent_spans, otelcol_exporter_send_failed_spans) on a
  # localhost-only Prometheus endpoint, which the prometheus/self receiver scrapes into the metrics/self pipeline, so
  # they reach CloudWatch like application metrics. A pull reader, because pushing them to this collector's own OTLP
  # receiver fails at shutdown: receivers stop first, so the final push has nowhere to go and the collector exits
  # non-zero.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 18888
                without_type_suffix: true
                without_units: true
