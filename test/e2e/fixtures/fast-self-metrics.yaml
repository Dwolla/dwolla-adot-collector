# Scrapes the collector's own metrics every 2 seconds instead of every 60, so a test sees them quickly. The scrape
# list replaces the shared one (lists aren't merged), so it repeats that fragment's job and target.
receivers:
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otelcol-custom
          scrape_interval: 2s
          static_configs:
            - targets:
                - 127.0.0.1:18888
